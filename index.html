
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickman Animation Engine</title>
<style>
body {
  margin: 0;
  background: #151923;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { margin: 20px; }
canvas {
  background: white;
  width: min(95%, 800px);
  border-radius: 10px;
  cursor: crosshair;
  touch-action: none;
}
.controls {
  margin: 15px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}
button {
  background: #26354b;
  color: white;
  border: 1px solid #536783;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
}
button:hover { background: #176c91; }
button:disabled { opacity: .6; cursor: wait; }
</style>
</head>
<body>

<h1>Stickman Animation Engine</h1>

<canvas id="canvas" width="800" height="450"></canvas>

<div class="controls">
  <button id="playButton" onclick="play()">▶ Play</button>
  <button onclick="addFrame()">＋ Add Frame</button>
  <button onclick="previous()">◀ Previous</button>
  <button onclick="next()">Next ▶</button>
  <button onclick="reset()">Reset</button>
  <button id="downloadButton" onclick="downloadAnimation()">⬇ Download Animation</button>
</div>

<p id="info">Frame 1</p>
<p id="status" aria-live="polite"></p>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let frames = [];
let current = 0;
let playing = false;
let animation;

function newStickman() {
  return {
    head: [400, 100],
    neck: [400, 140],
    body: [400, 260],
    leftHand: [320, 210],
    rightHand: [480, 210],
    leftElbow: [350, 180],
    rightElbow: [450, 180],
    leftKnee: [360, 330],
    rightKnee: [440, 330],
    leftFoot: [340, 400],
    rightFoot: [460, 400]
  };
}

frames.push(newStickman());

function drawStickman(p) {
  ctx.clearRect(0, 0, 800, 450);
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, 800, 450);

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 7;
  ctx.lineCap = "round";

  function line(a, b) {
    ctx.beginPath();
    ctx.moveTo(...p[a]);
    ctx.lineTo(...p[b]);
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(...p.head, 25, 0, Math.PI * 2);
  ctx.stroke();

  line("head", "neck");
  line("neck", "body");

  line("neck", "leftElbow");
  line("leftElbow", "leftHand");

  line("neck", "rightElbow");
  line("rightElbow", "rightHand");

  line("body", "leftKnee");
  line("leftKnee", "leftFoot");

  line("body", "rightKnee");
  line("rightKnee", "rightFoot");

  ctx.strokeStyle = "#ccc";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(50, 420);
  ctx.lineTo(750, 420);
  ctx.stroke();
}

function render() {
  drawStickman(frames[current]);

  document.getElementById("info").textContent =
    `Frame ${current + 1} / ${frames.length}`;
}

function addFrame() {
  stop();

  frames.splice(
    current + 1,
    0,
    JSON.parse(JSON.stringify(frames[current]))
  );

  current++;
  render();
}

function next() {
  stop();
  current = Math.min(current + 1, frames.length - 1);
  render();
}

function previous() {
  stop();
  current = Math.max(current - 1, 0);
  render();
}

function reset() {
  stop();
  frames = [newStickman()];
  current = 0;
  render();
}

function play() {
  if (playing) {
    stop();
    return;
  }

  if (frames.length < 2) {
    document.getElementById("status").textContent =
      "Add another frame to make an animation.";
    return;
  }

  playing = true;
  document.getElementById("playButton").textContent = "Ⅱ Pause";

  function step() {
    if (!playing) return;

    current = (current + 1) % frames.length;
    render();

    animation = setTimeout(step, 125);
  }

  step();
}

function stop() {
  playing = false;
  clearTimeout(animation);
  document.getElementById("playButton").textContent = "▶ Play";
}

// DOWNLOAD ANIMATION AS WEBM VIDEO
async function downloadAnimation() {
  const status = document.getElementById("status");
  const button = document.getElementById("downloadButton");

  if (!window.MediaRecorder || !canvas.captureStream) {
    status.textContent =
      "Video export is not supported in this browser.";
    return;
  }

  if (frames.length < 2) {
    status.textContent =
      "Add at least one more frame before downloading.";
    return;
  }

  stop();
  button.disabled = true;
  status.textContent = "Creating your video...";

  const originalFrame = current;
  const fps = 8;
  const stream = canvas.captureStream(30);

  let recorder;

  const types = [
    "video/webm;codecs=vp9",
    "video/webm;codecs=vp8",
    "video/webm"
  ];

  try {
    const type = types.find(t =>
      MediaRecorder.isTypeSupported(t)
    );

    recorder = type
      ? new MediaRecorder(stream, { mimeType: type })
      : new MediaRecorder(stream);

  } catch (error) {
    stream.getTracks().forEach(t => t.stop());
    button.disabled = false;
    status.textContent = "Could not start video recording.";
    current = originalFrame;
    render();
    return;
  }

  const chunks = [];

  recorder.ondataavailable = e => {
    if (e.data && e.data.size > 0) {
      chunks.push(e.data);
    }
  };

  recorder.onerror = () => {
    status.textContent = "Recording failed.";
    button.disabled = false;
    stream.getTracks().forEach(t => t.stop());
    current = originalFrame;
    render();
  };

  recorder.onstop = () => {
    const blob = new Blob(chunks, {
      type: recorder.mimeType || "video/webm"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "my-stickman-animation.webm";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);

    stream.getTracks().forEach(t => t.stop());

    current = originalFrame;
    render();

    button.disabled = false;
    status.textContent =
      "Video downloaded! Check your Downloads folder.";
  };

  recorder.start();

  // Record every frame
  for (let i = 0; i < frames.length; i++) {
    current = i;
    render();

    await new Promise(resolve =>
      setTimeout(resolve, 1000 / fps)
    );
  }

  await new Promise(resolve => setTimeout(resolve, 250));

  recorder.stop();
}

// DRAG BODY PARTS
let dragging = null;

canvas.addEventListener("pointerdown", e => {
  const rect = canvas.getBoundingClientRect();

  const x = (e.clientX - rect.left) * 800 / rect.width;
  const y = (e.clientY - rect.top) * 450 / rect.height;

  const p = frames[current];

  for (const key in p) {
    const [px, py] = p[key];

    if (Math.hypot(px - x, py - y) < 35) {
      dragging = key;
      break;
    }
  }

  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove", e => {
  if (!dragging || playing) return;

  const rect = canvas.getBoundingClientRect();

  frames[current][dragging] = [
    (e.clientX - rect.left) * 800 / rect.width,
    (e.clientY - rect.top) * 450 / rect.height
  ];

  render();
});

canvas.addEventListener("pointerup", () => {
  dragging = null;
});

canvas.addEventListener("pointercancel", () => {
  dragging = null;
});

render();
</script>

</body>
</html>
